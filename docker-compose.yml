# ModelMint production-ish stack: Postgres + MinIO + Redis + backend + nginx.
#
#   cp .env.docker.example .env      # set API_KEY_PEPPER / BOOTSTRAP_ADMIN_KEY
#   docker compose up --build
#
# Backend:  http://localhost:8000
# Frontend: http://localhost:8080
# MinIO:    http://localhost:9001 (console)
#
# Use the full backend image for XGBoost/LightGBM/CatBoost/TorchScript:
#   BACKEND_TARGET=full docker compose up --build

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: modelmint
      POSTGRES_PASSWORD: modelmint
      POSTGRES_DB: modelmint
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modelmint -d modelmint"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/modelmint &&
      echo 'bucket ready'
      "
    restart: "no"

  backend:
    build:
      context: ./backend
      target: ${BACKEND_TARGET:-slim}
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      LOG_JSON: "true"
      DATABASE_URL: postgresql+psycopg2://modelmint:modelmint@postgres:5432/modelmint
      STORAGE_BACKEND: s3
      MODEL_STORAGE_DIR: /app/storage
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: modelmint
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REGION: us-east-1
      REDIS_URL: redis://redis:6379/0
      API_KEY_PEPPER: ${API_KEY_PEPPER:?set API_KEY_PEPPER in .env}
      BOOTSTRAP_ADMIN_KEY: ${BOOTSTRAP_ADMIN_KEY:-}
      REQUIRE_AUTH_FOR_PREDICT: "true"
      REQUIRE_AUTH_FOR_READS: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - model_cache:/app/storage
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
  model_cache:
